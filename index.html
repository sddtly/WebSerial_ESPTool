<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    // 如果是 HTTP 请求，则重定向到 HTTPS。
    if (
      window.location.hostname !== "localhost" &&
      window.location.protocol === "http:"
    ) {
      window.location.href = "https:" + window.location.href.substring(5);
    }
  </script>

  <!-- 导入网页样式表以及主题 -->
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="css/light.css"
    id="light"
    class="alternate"
    disabled
  />
  <link
    rel="stylesheet"
    href="css/dark.css"
    id="dark"
    class="alternate"
    disabled
  />

  <!-- 导入网页的 JavaScript 文件 -->
  <script type="module">

<body>
<header class="header">
  <div class="header-content">
    <button id="butConnect" type="button">连接</button>
    <label for="baudRate">波特率</label>
    <select id="baudRate"></select>

    <label for="showlog">显示日志</label>
    <div class="onoffswitch">
      <input
        type="checkbox"
        name="showlog"
        class="onoffswitch-checkbox"
        id="showlog"
      />
      <label class="onoffswitch-label" for="showlog">
        <span class="onoffswitch-inner"></span>
        <span class="onoffswitch-switch"></span>
      </label>
    </div>

    <span class="log-controls">
          <label for="autoscroll">自动滚动</label>
          <div class="onoffswitch">
            <input
              type="checkbox"
              name="autoscroll"
              class="onoffswitch-checkbox"
              id="autoscroll"
            />
            <label class="onoffswitch-label" for="autoscroll">
              <span class="onoffswitch-inner"></span>
              <span class="onoffswitch-switch"></span>
            </label>
          </div>
          <button id="butClear" type="button" class="small-btn">
            清除
          </button>
        </span>

    <label for="debugmode">调试</label>
    <div class="onoffswitch">
      <input
        type="checkbox"
        name="debugmode"
        class="onoffswitch-checkbox"
        id="debugmode"
      />
      <label class="onoffswitch-label" for="debugmode">
        <span class="onoffswitch-inner"></span>
        <span class="onoffswitch-switch"></span>
      </label>
    </div>

    <label for="darkmode">暗色</label>
    <div class="onoffswitch">
      <input
        type="checkbox"
        name="darkmode"
        class="onoffswitch-checkbox"
        id="darkmode"
      />
      <label class="onoffswitch-label" for="darkmode">
        <span class="onoffswitch-inner"></span>
        <span class="onoffswitch-switch"></span>
      </label>
    </div>

    <div class="separator"></div>
    <div class="title">WebSerial ESP 工具</div>
  </div>
</header>

<!-- ESP32-S2 重连模态框 -->
<div id="esp32s2Modal" class="modal hidden">
  <div class="modal-content">
    <h2>ESP32-S2 已切换到 USB CDC 模式</h2>
    <p>请点击下方按钮选择新的串口。</p>
    <button id="butReconnectS2" type="button" class="modal-button">
      选择新端口
    </button>
  </div>
</div>
